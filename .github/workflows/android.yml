name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          echo "sdkmanager: $SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor
        env:
          LOGICODIX_DEFAULT_SERVER: ${{ vars.LOGICODIX_DEFAULT_SERVER }}
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GatraVolt.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GatraVolt-apk
          path: GatraVolt.apk
          if-no-files-found: error

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android APK terbaru
          body: |
            ## GatraVolt - Android APK

            **Unduh:** [GatraVolt.apk](https://github.com/raffsyahputra3-sys/tolongmastokennyaabis/releases/latest/download/GatraVolt.apk)

            Game pembelajaran fisika berbasis MOBA (3v3 real-time). Versi Android
            dari <https://gatravolt.onrender.com>.

            ### Cara pasang
            1. Unduh `GatraVolt.apk` dari tautan di atas (di HP Android).
            2. Buka berkasnya, lalu izinkan **Instal aplikasi tidak dikenal** bila diminta.
            3. Jalankan **GatraVolt**. Server bawaan: `wss://gatravolt.onrender.com`.
            4. Alamat server bisa diganti lewat ikon gerigi di layar awal.

            - Ukuran kurang lebih 5,7 MB, debug-signed, cukup untuk dipasang manual.
            - Minimal Android 7.0 (API 24). Layar terkunci landscape.
            - Butuh koneksi internet untuk bermain online.

            Build otomatis dari commit ${{ github.sha }}.
          files: GatraVolt.apk
          make_latest: true
